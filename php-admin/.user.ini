; PHP upload limits for the admin panel.
; Used by PHP-FPM and LiteSpeed (the default PHP handlers on Namecheap cPanel).
; Note: .user.ini has a 5-minute cache TTL — changes take effect within 5 min.
upload_max_filesize = 64M
post_max_size       = 128M
max_file_uploads    = 30
memory_limit        = 256M
